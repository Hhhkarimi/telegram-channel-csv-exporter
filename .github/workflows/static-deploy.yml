name: Deploy Static Next.js App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: pnpm install
        working-directory: web

      - name: Build Next.js static export
        run: pnpm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /telegram-channel-csv-exporter

      - name: Ensure .nojekyll is present
        run: touch web/out/.nojekyll

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/out
          branch: gh-pages
          clean: true